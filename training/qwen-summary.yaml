# Pilot settings. Run only after normalized train.jsonl is prepared.
model: mlx-community/Qwen3-8B-4bit
data: data/training/summary/normalized
adapter_path: data/training/adapters/summary
train: true
fine_tune_type: lora
batch_size: 1
num_layers: 4
iters: 40
learning_rate: 0.00001
max_seq_length: 4096
grad_checkpoint: true
mask_prompt: true
seed: 42
steps_per_report: 5
steps_per_eval: 20
val_batches: -1
save_every: 20
lora_parameters:
  rank: 8
  scale: 16.0
  dropout: 0.05
